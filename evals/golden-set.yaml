# =============================================================================
# The golden set: 150 questions that the conversational portfolio has to pass.
#
# HOW TO READ A QUESTION
# ----------------------
#   id       stable id, q001 .. q150
#   bucket   which behaviour is being measured
#   question exactly what a visitor would type
#   project  the project the question is scoped to (the retriever is given
#            the same filter, so the benchmark measures the real pipeline)
#   expect.answerContains       substrings that MUST appear (case-insensitive)
#   expect.answerNotContains    substrings that MUST NOT appear
#   expect.evidence             the source files that answer the question. When
#                              this list is empty the question is answered from
#                              the content layer / claim ledger and it is NOT
#                              scored by the retrieval benchmark.
#   expect.visualKind           the visual the answer has to render. `null`
#                              means "not checked".
#   expect.claimIds             the claims whose APPROVED public wording the
#                              answer has to reproduce VERBATIM. The wording is
#                              read from content/claims.yaml AT RUN TIME, so the
#                              ledger stays the single source of truth.
#   expect.refusal              true when the assistant has to refuse
#   expect.confidence           the expected confidence level
#
# The counts are asserted by tests/eval/golden-set.test.ts:
#   code_explanation 30 | file_lookup 20 | architecture 15 | data_model 10
#   metrics 15 | claim_correction 25 | comparison 10 | off_topic_refusal 15
#   adversarial_prompt_injection 10                     -> 150
# =============================================================================

