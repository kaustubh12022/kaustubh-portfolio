summary: >
  A card-score settlement engine built for 54-card deck group card games (including
  friendly rounds of Poker, Rummy, and Teen Patti / bluff). Built as an installable
  Vanilla JS/HTML5 PWA backed by Supabase Postgres & Realtime (NOT Flutter or Deno).
  The host enters rounds, everyone sees a live scoreboard, and an exact subset-sum
  dynamic programming (DP) settlement engine minimizes transfer transactions.

highlights:
  - Built for 54-card deck group card games (including friendly rounds of Poker, Rummy, and Teen Patti / bluff).
  - Built in Vanilla JS/HTML5 PWA with Supabase Postgres & Realtime (NOT Flutter or Deno).
  - Exact subset-sum DP settlement engine for up to 15 players to minimize transfer transactions, with a greedy fallback.
  - Integer-paise arithmetic to avoid floating-point drift.
  - Live scoreboard over Supabase Realtime with host-authoritative rounds.
  - 44 assert() call sites covering the settlement engine.

features:
  - title: Settlement engine
    detail: >
      The engine computes each player's net balance, then finds the minimum number
      of transfer transactions using an exact subset-sum dynamic programming algorithm
      for small groups and a greedy pass for larger ones. All amounts are integer paise.
    evidence: "app.js; test_suite.js"
  - title: Live session
    detail: >
      The host writes the session JSON; guests subscribe to the Supabase Realtime
      channel and see the scoreboard update. The host is the source of truth.
    evidence: "app.js; init_tables.js"
  - title: PWA shell
    detail: >
      Installable mobile-first Vanilla JS/HTML5/CSS3 PWA with offline caching for the shell
      and a compact score-entry flow.
    evidence: "manifest.json; sw.js"

