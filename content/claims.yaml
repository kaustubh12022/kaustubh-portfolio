- id: smartapply-cost
  topic: SmartApply cost reduction
  claim: "Ranking listings with >80% cost reduction."
  status: unverified
  evidence: >
    [prose] Two different measurements are usually conflated. First, the filter cut the
    number of LLM scoring calls by 69.3% in the recorded batch (3,360 raw postings
    -> 1,032 scored, from full_matrix_results.json stats). Second, the project's
    own documentation records a separate token-cost measurement: 62.57% cost
    savings against baseline with a 99.77% prompt-prefix cache-hit rate
    (SUMMARY.md:18, 88-89, 192, 476). The rate table at SUMMARY.md:189-190 is
    deepseek-chat $0.07 cache-hit / $0.27 cache-miss / $1.10 completion per 1M
    tokens, and src/ai_engine.py:59-74 (calculate_deepseek_cost) implements exactly
    that three-rate accounting. src/scorer.py:538-562 runs the first scoring call
    serially to warm the provider cache before the rest fan out with
    asyncio.gather. Neither measurement reaches 80%, and no independent A/B cost
    run beyond the project's own documentation was found.
  source: "JobHunt-Automation/full_matrix_results.json; JobHunt-Automation/SUMMARY.md; src/ai_engine.py; src/scorer.py"
  publicWording: >
    Two different numbers are usually conflated here. The filter cut LLM scoring
    calls by 69% — 3,360 raw postings became 1,032 scored in the recorded batch.
    Separately, prompt-prefix caching brought token cost down 62.57% against
    baseline, with a 99.77% cache-hit rate; the first scoring call runs serially to
    warm the provider cache before the rest fan out. I do not claim an 80% cost
    reduction.

