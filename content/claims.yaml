- id: c54-stack
  topic: C54 technology stack
  claim: "Built a full-stack real-time multiplayer gaming platform with React, Node.js, Socket.IO, Tailwind CSS and Vite."
  status: contradicted
  evidence: >
    [prose] The repo is Vanilla JS ES6 modules with Supabase Postgres + Realtime and a PWA
    shell (service worker + manifest). There is no React, no Node.js server, no
    Socket.IO, no Tailwind and no Vite. package.json has exactly one dependency:
    pg, used only by the one-shot DDL script init_tables.js and the test harness.
    style.css is 2,024 lines of hand-written CSS with a :root token block and no
    Tailwind. index.html:18 loads a single CDN script. Realtime works through
    Supabase postgres_changes subscriptions (app.js:1192-1230), not Socket.IO.
    app.js contains zero setInterval calls, so there is no game loop; the app
    records and settles real-card games played offline. The genuine technical
    centre is a subset-sum DP settlement engine (app.js:1608-1654
    findZeroSumSubsets with Int32Array(1 << n)), plus a greedy
    minimumTransactions pass (app.js:1518-1607).
  source: "C54-Casino/package.json; C54-Casino/app.js:1518-1607,1608-1654,1192-1230; C54-Casino/style.css; C54-Casino/index.html:18"
  publicWording: >
    C54 is a vanilla-JS PWA backed by Supabase Postgres and Realtime — no React, no
    Node server, no Socket.IO, no Tailwind. The interesting part is the settlement
    engine: a subset-sum dynamic program finds groups of players whose balances sum
    to exactly zero, and a greedy pass then matches the largest debtor to the
    largest creditor to minimise the number of transfers.

